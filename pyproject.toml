[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adn-podcast-processor"
version = "0.1.0"
description = "AI-powered post-production CLI for the ADN Divergente Podcast"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ADN Divergente", email = "miguel.mendez@mendecity.com" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.1",
    "openai>=1.30.0",
    "groq>=0.9.0",
    "faster-whisper>=1.0.2",
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "pillow>=10.3.0",
]

[project.scripts]
adn = "adn.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
